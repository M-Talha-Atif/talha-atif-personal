apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
configMapGenerator:
  - name: api-code
    files: [server.js]                  # change server.js → new hash → pods roll automatically
  - name: api-settings
    literals: [APP_GREETING=hello from a ConfigMap]
secretGenerator:
  - name: api-secret
    literals: [API_KEY=demo-only-not-a-real-secret]
