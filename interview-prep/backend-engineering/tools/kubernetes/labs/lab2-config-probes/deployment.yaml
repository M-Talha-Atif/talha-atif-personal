apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: node:20-alpine
          command: ["node", "/app/server.js"]
          ports: [{ containerPort: 3000 }]
          env:
            - name: APP_GREETING             # single key from a ConfigMap
              valueFrom:
                configMapKeyRef: { name: api-settings, key: APP_GREETING }
            - name: API_KEY                  # single key from a Secret
              valueFrom:
                secretKeyRef: { name: api-secret, key: API_KEY }
            - name: STARTUP_DELAY_MS
              value: "8000"
          volumeMounts:
            - { name: code, mountPath: /app }   # server.js comes from a ConfigMap volume
          startupProbe:                       # gives slow starters time; disables the others until it passes
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:                     # NOT ready → removed from Service endpoints (no restart)
            httpGet: { path: /readyz, port: 3000 }
            periodSeconds: 3
          livenessProbe:                      # fails → kubelet RESTARTS the container
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000                   # the node image's "node" user
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: code
          configMap:
            name: api-code                    # name gets a content-hash suffix from kustomize
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - { port: 80, targetPort: 3000 }
