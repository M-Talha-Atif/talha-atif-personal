events {}
http {
  # Docker's embedded DNS; re-resolve so restarts of a service don't break nginx
  resolver 127.0.0.11 valid=10s;

  server {
    listen 80;

    location /users/ {
      set $upstream http://users:3000;
      proxy_pass $upstream;
    }
    location /orders/ {
      set $upstream http://orders:3000;
      proxy_pass $upstream;
    }
    location /health { return 200 'gateway ok'; }
  }
}
