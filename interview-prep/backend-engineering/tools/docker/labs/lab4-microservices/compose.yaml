services:
  gateway:                       # the ONLY thing published to the host
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [public, internal]
    depends_on:
      users:  { condition: service_healthy }
      orders: { condition: service_healthy }

  users:                         # no `ports:` → unreachable from outside
    build: { context: ., dockerfile: Dockerfile.service, args: { SERVICE: users } }
    networks: [internal]
    restart: unless-stopped

  orders:
    build: { context: ., dockerfile: Dockerfile.service, args: { SERVICE: orders } }
    environment:
      USERS_URL: http://users:3000
    networks: [internal]
    depends_on:
      users: { condition: service_healthy }
    restart: unless-stopped

networks:
  public:
  internal:
