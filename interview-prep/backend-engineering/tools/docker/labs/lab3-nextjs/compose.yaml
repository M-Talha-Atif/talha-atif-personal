services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000   # what the BROWSER will call
    ports:
      - "3000:3000"
    environment:
      # Server-side (SSR / route handlers) uses the internal Docker DNS name
      INTERNAL_API_URL: http://api:4000
    # api: your backend service here (see lab1 / lab4)
