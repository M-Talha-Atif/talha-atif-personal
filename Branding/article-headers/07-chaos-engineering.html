<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" />
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/satoshi" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0b0b0d; }

  .card { position: relative; width: 1200px; height: 630px; background: #0b0b0d; font-family: 'Inter', ui-sans-serif, system-ui; }

  .bg-grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(ellipse 900px 500px at 30% 50%, black 40%, transparent 85%);
  }

  .glow {
    position: absolute; width: 520px; height: 520px; right: -80px; top: 50%; transform: translateY(-50%);
    border-radius: 50%; background: linear-gradient(135deg, #7dd3fc, #c4b5fd); filter: blur(90px); opacity: 0.28;
  }

  .content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: center; padding-left: 76px; max-width: 660px; }
  .kicker { font-family: 'Space Grotesk', ui-monospace, monospace; text-transform: uppercase; letter-spacing: 3px; font-size: 15px; font-weight: 600; color: #CFFFDC; margin-bottom: 22px; }
  .title { font-family: 'Satoshi', 'Inter', ui-sans-serif; font-weight: 700; font-size: 60px; line-height: 1.08; letter-spacing: -1.2px; color: #f5f5f5; margin-bottom: 22px; }
  .subtitle { font-family: 'Inter', ui-sans-serif; font-size: 22px; line-height: 1.45; color: #bdbdbd; max-width: 540px; }

  .brand { position: absolute; left: 76px; bottom: 44px; z-index: 2; display: flex; flex-direction: column; gap: 4px; }
  .brand-name { font-family: 'Satoshi', 'Inter', ui-sans-serif; font-weight: 600; font-size: 17px; color: #e6e6e6; }
  .brand-role { font-family: 'Space Grotesk', ui-monospace, monospace; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: #7dd3fc; }

  .critter { position: absolute; right: 96px; top: 50%; transform: translateY(-50%); width: 320px; height: 320px; z-index: 2; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.55)); }
  .badge-ring { position: absolute; right: 96px; top: 50%; transform: translateY(-50%); width: 320px; height: 320px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.08); }
</style>
</head>
<body>
  <div class="card">
    <div class="bg-grid"></div>
    <div class="glow"></div>
    <div class="badge-ring"></div>

    <div class="content">
      <span class="kicker">Resilience</span>
      <h1 class="title">Chaos Engineering</h1>
      <p class="subtitle">Breaking things on purpose, before they break on their own.</p>
    </div>

    <div class="brand">
      <div class="brand-name">M. Talha Atif</div>
      <div class="brand-role">Full Stack Engineer</div>
    </div>

    <svg class="critter" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="raccGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7dd3fc"/>
          <stop offset="1" stop-color="#c4b5fd"/>
        </linearGradient>
      </defs>

      <path d="M215,238 Q248,218 236,178 Q258,206 233,248 Z" fill="url(#raccGrad)"/>
      <path d="M223,228 Q240,212 233,193" stroke="#0b0b0d" stroke-width="5" fill="none" opacity="0.3" stroke-linecap="round"/>

      <path d="M95,95 L75,48 L122,88 Z" fill="#CFFFDC"/>
      <path d="M205,95 L225,48 L178,88 Z" fill="#CFFFDC"/>
      <circle cx="150" cy="155" r="85" fill="#CFFFDC"/>

      <path d="M90,145 Q150,120 210,145 Q208,173 150,173 Q92,173 90,145 Z" fill="#0b0b0d" opacity="0.82"/>
      <circle cx="122" cy="150" r="6.5" fill="#CFFFDC"/>
      <circle cx="178" cy="150" r="6.5" fill="#CFFFDC"/>
      <circle cx="123" cy="150" r="2.8" fill="#0b0b0d"/>
      <circle cx="179" cy="150" r="2.8" fill="#0b0b0d"/>

      <path d="M144,192 L156,192 L150,200 Z" fill="#0b0b0d"/>
      <path d="M127,207 Q150,220 173,207" stroke="#0b0b0d" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <g transform="translate(42,220)">
        <rect x="0" y="0" width="50" height="26" rx="13" fill="url(#raccGrad)"/>
        <circle cx="37" cy="13" r="11" fill="#0b0b0d"/>
      </g>
      <path d="M58,196 L49,213 L60,213 L51,232" stroke="#CFFFDC" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</body>
</html>
