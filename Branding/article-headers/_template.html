<!-- REUSABLE ARTICLE HEADER TEMPLATE
     Canvas: 1200x630 (standard blog/OG cover size)
     Brand tokens pulled directly from the portfolio (src/app/globals.css):
       bg      #0b0b0d
       text    #e6e6e6 / #f5f5f5
       subtext #bdbdbd
       mint    #CFFFDC   (accent-solid)
       gradient  linear-gradient(90deg, #7dd3fc, #c4b5fd)  (accent)
     Fonts: Satoshi (headings), Inter (body), Space Grotesk (kicker/mono)

     TO REUSE FOR A NEW ARTICLE:
       1. Duplicate one of the 01-05 files in this folder.
       2. Change: .kicker text, .title text, .subtitle text, .brand text (usually leave as-is).
       3. Swap the <g class="critter-art"> block for a new animal, or reuse an existing one.
       4. Render to PNG with headless Chrome:
          chrome.exe --headless --disable-gpu --window-size=1200,630 --screenshot="out.png" --default-background-color=00000000 --virtual-time-budget=3000 "file:///<path>.html"
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap');
  @import url('https://fonts.cdnfonts.com/css/satoshi');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0b0b0d; }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    background: #0b0b0d;
    font-family: 'Inter', ui-sans-serif, system-ui;
  }

  .bg-grid {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(ellipse 900px 500px at 30% 50%, black 40%, transparent 85%);
  }

  .glow {
    position: absolute;
    width: 520px;
    height: 520px;
    right: -80px;
    top: 50%;
    transform: translateY(-50%);
    border-radius: 50%;
    background: linear-gradient(135deg, #7dd3fc, #c4b5fd);
    filter: blur(90px);
    opacity: 0.28;
  }

  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 0 0 76px;
    max-width: 660px;
  }

  .kicker {
    font-family: 'Space Grotesk', ui-monospace, monospace;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 15px;
    font-weight: 600;
    color: #CFFFDC;
    margin-bottom: 22px;
  }

  .title {
    font-family: 'Satoshi', 'Inter', ui-sans-serif;
    font-weight: 700;
    font-size: 60px;
    line-height: 1.08;
    letter-spacing: -1.2px;
    color: #f5f5f5;
    margin-bottom: 22px;
  }

  .subtitle {
    font-family: 'Inter', ui-sans-serif;
    font-size: 22px;
    line-height: 1.45;
    color: #bdbdbd;
    max-width: 540px;
  }

  .brand {
    position: absolute;
    left: 76px;
    bottom: 44px;
    z-index: 2;
    font-family: 'Space Grotesk', ui-monospace, monospace;
    font-size: 14px;
    letter-spacing: 1.5px;
    color: #7dd3fc;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #CFFFDC;
    display: inline-block;
  }

  .critter {
    position: absolute;
    right: 96px;
    top: 50%;
    transform: translateY(-50%);
    width: 320px;
    height: 320px;
    z-index: 2;
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.55));
  }

  .badge-ring {
    position: absolute;
    right: 96px;
    top: 50%;
    transform: translateY(-50%);
    width: 320px;
    height: 320px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.08);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="bg-grid"></div>
    <div class="glow"></div>
    <div class="badge-ring"></div>

    <div class="content">
      <span class="kicker">KICKER LABEL</span>
      <h1 class="title">Article Title Here</h1>
      <p class="subtitle">One line subtitle or dek goes here, kept short.</p>
    </div>

    <div class="brand">talhaatif.tech</div>

    <svg class="critter" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <!-- swap animal artwork here -->
    </svg>
  </div>
</body>
</html>
