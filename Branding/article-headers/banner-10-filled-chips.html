<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" />
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/satoshi" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; background: #0b0b0d; }

  .card { position: relative; width: 1584px; height: 396px; background: #0b0b0d; font-family: 'Inter', ui-sans-serif, system-ui; }

  .bg-grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 26px 26px;
  }

  .glow {
    position: absolute; width: 620px; height: 620px; left: 50%; top: 50%; transform: translate(-50%, -50%);
    border-radius: 50%; background: linear-gradient(135deg, #7dd3fc, #c4b5fd); filter: blur(120px); opacity: 0.22;
  }

  .content {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }

  .heading {
    font-family: 'Satoshi', 'Inter', ui-sans-serif; font-weight: 700; font-size: 50px;
    letter-spacing: -1px; color: #f5f5f5; margin-bottom: 14px; line-height: 1.1;
  }

  .subheading {
    font-family: 'Inter', ui-sans-serif; font-size: 20px; color: #bdbdbd; margin-bottom: 26px;
  }

  .chips { display: flex; gap: 12px; }
  .chip {
    font-family: 'Space Grotesk', ui-monospace, monospace; font-size: 14px; font-weight: 600;
    color: #0b0b0d; background: linear-gradient(135deg, #7dd3fc, #c4b5fd); border-radius: 999px;
    padding: 9px 20px; letter-spacing: 0.4px;
  }
  .chip.mint { background: #CFFFDC; }
</style>
</head>
<body>
  <div class="card">
    <div class="bg-grid"></div>
    <div class="glow"></div>

    <div class="content">
      <h1 class="heading">Building Systems That Don't Break</h1>
      <p class="subheading">50% latency cuts, zero downtime migrations, real scale</p>
      <div class="chips">
        <span class="chip mint">50% Latency Cut</span>
        <span class="chip">Zero Downtime</span>
        <span class="chip mint">gRPC</span>
        <span class="chip">Kafka</span>
      </div>
    </div>
  </div>
</body>
</html>
