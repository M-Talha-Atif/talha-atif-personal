<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" />
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/satoshi" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0b0b0d; }

  .card { position: relative; width: 1200px; height: 630px; background: #0b0b0d; font-family: 'Inter', ui-sans-serif, system-ui; }

  .bg-grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(ellipse 900px 500px at 30% 50%, black 40%, transparent 85%);
  }

  .glow {
    position: absolute; width: 520px; height: 520px; right: -80px; top: 50%; transform: translateY(-50%);
    border-radius: 50%; background: linear-gradient(135deg, #7dd3fc, #c4b5fd); filter: blur(90px); opacity: 0.28;
  }

  .content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: center; padding-left: 76px; max-width: 660px; }
  .kicker { font-family: 'Space Grotesk', ui-monospace, monospace; text-transform: uppercase; letter-spacing: 3px; font-size: 15px; font-weight: 600; color: #CFFFDC; margin-bottom: 22px; }
  .title { font-family: 'Satoshi', 'Inter', ui-sans-serif; font-weight: 700; font-size: 60px; line-height: 1.08; letter-spacing: -1.2px; color: #f5f5f5; margin-bottom: 22px; }
  .subtitle { font-family: 'Inter', ui-sans-serif; font-size: 22px; line-height: 1.45; color: #bdbdbd; max-width: 540px; }

  .brand { position: absolute; left: 76px; bottom: 44px; z-index: 2; font-family: 'Space Grotesk', ui-monospace, monospace; font-size: 14px; letter-spacing: 1.5px; color: #7dd3fc; display: flex; align-items: center; gap: 10px; }
  .brand::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #CFFFDC; display: inline-block; }

  .critter { position: absolute; right: 90px; top: 50%; transform: translateY(-50%); width: 340px; height: 320px; z-index: 2; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.55)); }
  .badge-ring { position: absolute; right: 96px; top: 50%; transform: translateY(-50%); width: 320px; height: 320px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.08); }
</style>
</head>
<body>
  <div class="card">
    <div class="bg-grid"></div>
    <div class="glow"></div>
    <div class="badge-ring"></div>

    <div class="content">
      <span class="kicker">Concurrency</span>
      <h1 class="title">Race Conditions</h1>
      <p class="subtitle">When two threads reach the carrot at once.</p>
    </div>

    <div class="brand">talha-atif.vercel.app</div>

    <svg class="critter" viewBox="0 0 340 320" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="foxGrad2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7dd3fc"/>
          <stop offset="1" stop-color="#c4b5fd"/>
        </linearGradient>
      </defs>

      <line x1="0" y1="150" x2="30" y2="150" stroke="#e6e6e6" stroke-width="3" opacity="0.25" stroke-linecap="round"/>
      <line x1="5" y1="165" x2="30" y2="165" stroke="#e6e6e6" stroke-width="3" opacity="0.2" stroke-linecap="round"/>
      <line x1="310" y1="150" x2="340" y2="150" stroke="#e6e6e6" stroke-width="3" opacity="0.25" stroke-linecap="round"/>
      <line x1="310" y1="165" x2="335" y2="165" stroke="#e6e6e6" stroke-width="3" opacity="0.2" stroke-linecap="round"/>

      <g transform="translate(15,110)">
        <ellipse cx="14" cy="20" rx="10" ry="34" fill="#CFFFDC" transform="rotate(-12 14 20)"/>
        <ellipse cx="46" cy="20" rx="10" ry="34" fill="#CFFFDC" transform="rotate(12 46 20)"/>
        <ellipse cx="30" cy="70" rx="34" ry="30" fill="#CFFFDC"/>
        <circle cx="20" cy="68" r="4" fill="#0b0b0d"/>
        <circle cx="40" cy="68" r="4" fill="#0b0b0d"/>
        <ellipse cx="30" cy="82" rx="5" ry="3.5" fill="#0b0b0d"/>
      </g>

      <g transform="translate(230,110)">
        <ellipse cx="14" cy="20" rx="10" ry="34" fill="url(#foxGrad2)" transform="rotate(12 14 20)"/>
        <ellipse cx="46" cy="20" rx="10" ry="34" fill="url(#foxGrad2)" transform="rotate(-12 46 20)"/>
        <ellipse cx="30" cy="70" rx="34" ry="30" fill="url(#foxGrad2)"/>
        <circle cx="20" cy="68" r="4" fill="#0b0b0d"/>
        <circle cx="40" cy="68" r="4" fill="#0b0b0d"/>
        <ellipse cx="30" cy="82" rx="5" ry="3.5" fill="#0b0b0d"/>
      </g>

      <g transform="translate(150,215)">
        <path d="M15,0 L30,0 L22,55 Z" fill="#CFFFDC"/>
        <path d="M15,0 q-10,-15 -2,-20" stroke="#7dd3fc" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M22,-2 q0,-18 8,-22" stroke="#c4b5fd" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M29,0 q10,-14 4,-20" stroke="#7dd3fc" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>
</body>
</html>
