<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" />
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/satoshi" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0b0b0d; }

  .card { position: relative; width: 1200px; height: 630px; background: #0b0b0d; font-family: 'Inter', ui-sans-serif, system-ui; }

  .bg-grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(ellipse 900px 500px at 30% 50%, black 40%, transparent 85%);
  }

  .glow {
    position: absolute; width: 520px; height: 520px; right: -80px; top: 50%; transform: translateY(-50%);
    border-radius: 50%; background: linear-gradient(135deg, #7dd3fc, #c4b5fd); filter: blur(90px); opacity: 0.28;
  }

  .content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: center; padding-left: 76px; max-width: 660px; }
  .kicker { font-family: 'Space Grotesk', ui-monospace, monospace; text-transform: uppercase; letter-spacing: 3px; font-size: 15px; font-weight: 600; color: #CFFFDC; margin-bottom: 22px; }
  .title { font-family: 'Satoshi', 'Inter', ui-sans-serif; font-weight: 700; font-size: 60px; line-height: 1.08; letter-spacing: -1.2px; color: #f5f5f5; margin-bottom: 22px; }
  .subtitle { font-family: 'Inter', ui-sans-serif; font-size: 22px; line-height: 1.45; color: #bdbdbd; max-width: 540px; }

  .brand { position: absolute; left: 76px; bottom: 44px; z-index: 2; font-family: 'Space Grotesk', ui-monospace, monospace; font-size: 14px; letter-spacing: 1.5px; color: #7dd3fc; display: flex; align-items: center; gap: 10px; }
  .brand::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #CFFFDC; display: inline-block; }

  .critter { position: absolute; right: 96px; top: 50%; transform: translateY(-50%); width: 320px; height: 320px; z-index: 2; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.55)); }
  .badge-ring { position: absolute; right: 96px; top: 50%; transform: translateY(-50%); width: 320px; height: 320px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.08); }
</style>
</head>
<body>
  <div class="card">
    <div class="bg-grid"></div>
    <div class="glow"></div>
    <div class="badge-ring"></div>

    <div class="content">
      <span class="kicker">Distributed Systems</span>
      <h1 class="title">Eventual Consistency</h1>
      <p class="subtitle">The fox that always catches up.</p>
    </div>

    <div class="brand">talha-atif.vercel.app</div>

    <svg class="critter" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="foxGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7dd3fc"/>
          <stop offset="1" stop-color="#c4b5fd"/>
        </linearGradient>
      </defs>
      <path d="M105,90 L75,40 L130,80 Z" fill="url(#foxGrad)"/>
      <path d="M195,90 L225,40 L170,80 Z" fill="url(#foxGrad)"/>
      <path d="M108,85 L92,55 L122,78 Z" fill="#0b0b0d" opacity="0.35"/>
      <path d="M192,85 L208,55 L178,78 Z" fill="#0b0b0d" opacity="0.35"/>
      <path d="M150,60 L215,150 Q215,215 150,230 Q85,215 85,150 Z" fill="url(#foxGrad)"/>
      <ellipse cx="110" cy="178" rx="22" ry="16" fill="#CFFFDC" opacity="0.95"/>
      <ellipse cx="190" cy="178" rx="22" ry="16" fill="#CFFFDC" opacity="0.95"/>
      <ellipse cx="128" cy="148" rx="6" ry="8" fill="#0b0b0d"/>
      <ellipse cx="172" cy="148" rx="6" ry="8" fill="#0b0b0d"/>
      <path d="M150,175 L165,195 Q150,212 135,195 Z" fill="#CFFFDC"/>
      <ellipse cx="150" cy="192" rx="6" ry="4" fill="#0b0b0d"/>
    </svg>
  </div>
</body>
</html>
